services:
  db:
    image: postgres:16-alpine
    container_name: worldcup_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worldcup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worldcup"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight web UI to inspect tables/data live during development.
  # Open http://localhost:8080 (System: PostgreSQL, Server: db, User/Pass/DB: postgres/postgres/worldcup)
  adminer:
    image: adminer:4
    container_name: worldcup_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
